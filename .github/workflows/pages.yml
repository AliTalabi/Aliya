name: Build and deploy Aliya to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pgzero pygbag
      - name: Prepare browser entrypoint
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          s = Path("Aliya.py").read_text(encoding="utf-8")

          # Remove desktop-only imports/APIs.
          for line in (
              "import pyperclip\n",
              "import tkinter as tk\n",
              "from tkinter import messagebox\n",
              "from ctypes import windll\n",
              "import webbrowser\n",
          ):
              s = s.replace(line, "", 1)

          s = re.sub(
              r"(?m)^hwnd = pygame\.display\.get_wm_info\(\)\['window'\]\n"
              r"^windll\.user32\.MoveWindow\(hwnd, 175, 100, WIDTH, HEIGHT, False\)\n?",
              "",
              s,
              count=1,
          )

          s = re.sub(
              r"(?ms)^def hack_game\(\):\n.*?(?=^def shop_come\(\):)",
              "def hack_game():\n    global game_status\n    game_status = \"starting_menu\"\n\n\n",
              s,
              count=1,
          )

          s = s.replace('pyperclip.copy("+989044089850")', "pass")
          s = s.replace('pyperclip.copy("ali.talabi.25@gmail.com")', "pass")
          s = re.sub(r"webbrowser\.open\((url_telegram|url_instagram|url_rubika|url_eitaa)\)", "pass", s)

          # Browser builds cannot persist files with normal open(..., "w").
          # Remove exact write blocks without relying on fragile escaped regexes.
          lines = s.splitlines(keepends=True)
          out = []
          i = 0
          removed_writes = 0
          while i < len(lines):
              line = lines[i]
              m = re.match(r"^(\s*)with open\((.*?),\s*['\"]w['\"]\) as [A-Za-z_]\w*:\s*$", line.rstrip("\n"))
              if m and i + 1 < len(lines):
                  next_line = lines[i + 1]
                  if re.match(r"^" + re.escape(m.group(1)) + r"    (json\.dump|.*\.write\()", next_line):
                      out.append(m.group(1) + "# Browser persistence disabled; state remains in memory.\n")
                      i += 2
                      removed_writes += 1
                      continue
              out.append(line)
              i += 1
          s = "".join(out)
          print("REMOVED_WRITE_BLOCKS=", removed_writes)

          s = s.replace("mod.screen.", "screen.")

          Path("Aliya_web.py").write_text(s, encoding="utf-8")

          main = s.replace("import pgzrun\n", "", 1)
          main = main.replace("\npgzrun.go()\n", "\n", 1)
          if not main.startswith("#!pgzrun\n"):
              main = "#!pgzrun\n" + main
          Path("main.py").write_text(main, encoding="utf-8")
          PY
          python -m py_compile main.py

      - name: Validate browser source
        run: |
          if grep -nE 'open\([^\n]*["'\''"]w["'\''"]\)' main.py; then
            echo "ERROR: browser-incompatible file write remains"
            exit 1
          fi
          grep -n "^#!pgzrun" main.py

      - name: Build web game
        run: |
          rm -rf build
          python -m pygbag --build --ume_block 0 main.py
          test -f build/web/index.html
          test -f build/web/aliya.apk
          test -f build/web/aliya.tar.gz
          tar -tzf build/web/aliya.tar.gz | grep -q "assets/main.py"

      - name: Browser smoke test
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python -m http.server 8000 --directory build/web >/tmp/aliya-http.log 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID || true" EXIT
          cat > /tmp/test_aliya.py <<'PY'
          import asyncio
          from playwright.async_api import async_playwright

          async def main():
              errors = []
              console = []
              async with async_playwright() as p:
                  browser = await p.chromium.launch()
                  page = await browser.new_page(viewport={"width": 1200, "height": 800})
                  page.on("pageerror", lambda e: errors.append("PAGEERROR: " + str(e)))
                  page.on("console", lambda m: console.append(f"{m.type}: {m.text}"))
                  await page.goto("http://127.0.0.1:8000/", wait_until="load", timeout=30000)
                  await page.wait_for_timeout(60000)
                  await page.screenshot(path="/tmp/aliya.png", full_page=True)
                  canvas = await page.locator("canvas").count()
                  body = await page.locator("body").inner_text()
                  print("CANVAS_COUNT=", canvas)
                  print("BODY_TEXT=", body[:1000])
                  print("PAGE_ERRORS=", errors[-20:])
                  print("CONSOLE=", console[-50:])
                  if errors:
                      raise RuntimeError("\n".join(errors[-20:]))
                  if canvas == 0:
                      raise RuntimeError("No canvas was created by the game.")
                  await browser.close()

          asyncio.run(main())
          PY
          python /tmp/test_aliya.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
