name: Build and deploy Aliya to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install browser runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install pygame-ce pygbag playwright

      - name: Generate browser entrypoint
        run: |
          python build_web.py
          python -m py_compile main.py

      - name: Build web package
        run: |
          rm -rf build
          python -m pygbag --build --ume_block 0 main.py
          test -f build/web/index.html
          test -f build/web/aliya.apk
          test -f build/web/aliya.tar.gz
          tar -tzf build/web/aliya.tar.gz | grep -q "assets/main.py"

      - name: Browser smoke test
        run: |
          python -m playwright install --with-deps chromium
          python -m http.server 8000 --directory build/web >/tmp/aliya-http.log 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID || true" EXIT
          cat > /tmp/test_aliya.py <<'PY'
          import asyncio
          from playwright.async_api import async_playwright

          async def main():
              errors = []
              console = []
              async with async_playwright() as p:
                  browser = await p.chromium.launch()
                  page = await browser.new_page(viewport={"width": 1200, "height": 800})
                  page.on("pageerror", lambda e: errors.append(str(e)))
                  page.on("console", lambda m: console.append(f"{m.type}: {m.text}"))
                  await page.goto("http://127.0.0.1:8000/", wait_until="load", timeout=30000)
                  await page.wait_for_timeout(30000)
                  await page.screenshot(path="/tmp/aliya.png", full_page=True)
                  print("CANVAS_COUNT=", await page.locator("canvas").count())
                  print("PAGE_ERRORS=", errors[-30:])
                  print("CONSOLE=", console[-100:])
                  if errors:
                      raise RuntimeError("\n".join(errors[-30:]))
                  if await page.locator("canvas").count() == 0:
                      raise RuntimeError("No canvas created")
                  await browser.close()

          asyncio.run(main())
          PY
          python /tmp/test_aliya.py

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics
          path: |
            /tmp/aliya.png
            /tmp/aliya-http.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Pages artifact
        if: success()
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
