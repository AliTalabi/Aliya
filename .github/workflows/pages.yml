name: Build and deploy Aliya to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pygame-ce pygbag

      - name: Prepare pure pygame browser entrypoint
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          s = Path("Aliya.py").read_text(encoding="utf-8")

          # Remove Pygame Zero and desktop-only imports. The browser build uses
          # a small local compatibility layer implemented below.
          for line in (
              "import pgzrun\n",
              "import pyperclip\n",
              "import tkinter as tk\n",
              "from tkinter import messagebox\n",
              "from ctypes import windll\n",
              "import webbrowser\n",
              "from pgzero import clock, music\n",
              "from pgzero.keyboard import keyboard\n",
              "from pgzero.actor import Actor\n",
              "from pgzero.loaders import sounds\n",
          ):
              s = s.replace(line, "", 1)

          s = re.sub(
              r"(?m)^hwnd = pygame\.display\.get_wm_info\(\)\['window'\]\n"
              r"^windll\.user32\.MoveWindow\(hwnd, 175, 100, WIDTH, HEIGHT, False\)\n?",
              "",
              s,
              count=1,
          )

          # Disable the desktop-only Tkinter helper in the browser.
          s = re.sub(
              r"(?ms)^def hack_game\(\):\n.*?(?=^def shop_come\(\):)",
              "def hack_game():\n    global game_status\n    game_status = \"starting_menu\"\n\n\n",
              s,
              count=1,
          )

          s = s.replace('pyperclip.copy("+989044089850")', "pass")
          s = s.replace('pyperclip.copy("ali.talabi.25@gmail.com")', "pass")
          s = re.sub(
              r"webbrowser\.open\((url_telegram|url_instagram|url_rubika|url_eitaa)\)",
              "pass",
              s,
          )

          # Normal browser file writes are not appropriate here. Keep the
          # bundled JSON files readable, but keep state in memory for this build.
          lines = s.splitlines(keepends=True)
          out = []
          i = 0
          removed_writes = 0
          while i < len(lines):
              line = lines[i]
              m = re.match(
                  r"^(\s*)with open\((.*?),\s*['\"]w['\"]\) as [A-Za-z_]\w*:\s*$",
                  line.rstrip("\n"),
              )
              if m and i + 1 < len(lines):
                  next_line = lines[i + 1]
                  if re.match(
                      r"^" + re.escape(m.group(1)) + r"    (json\.dump|.*\.write\()",
                      next_line,
                  ):
                      out.append(
                          m.group(1) + "# Browser persistence disabled; state remains in memory.\n"
                      )
                      i += 2
                      removed_writes += 1
                      continue
              out.append(line)
              i += 1
          s = "".join(out)
          print("REMOVED_WRITE_BLOCKS=", removed_writes)

          s = s.replace("mod.screen.", "screen.")
          s = s.replace("\npgzrun.go()\n", "\n")

          # Insert a pure-pygame compatibility layer immediately after WIDTH,
          # HEIGHT and TITLE are defined.
          marker = 'TITLE = "Aliya"\n'
          compat = r'''
          import asyncio
          import os
          import time

          pygame.init()
          try:
              pygame.mixer.init()
          except Exception:
              pass

          _image_cache = {}
          _sound_cache = {}
          _running = True

          def _asset_path(kind, name):
              name = str(name)
              base = os.path.join(kind, name)
              for ext in ("", ".png", ".jpg", ".jpeg", ".webp"):
                  candidate = base + ext
                  if os.path.isfile(candidate):
                      return candidate
              raise FileNotFoundError(f"Asset not found: {kind}/{name}")

          def _load_image(name):
              key = str(name)
              if key not in _image_cache:
                  _image_cache[key] = pygame.image.load(
                      _asset_path("images", key)
                  ).convert_alpha()
              return _image_cache[key]

          class _DrawProxy:
              def __init__(self, surface):
                  self.surface = surface

              def text(self, text, **kwargs):
                  size = int(kwargs.get("fontsize", 30))
                  color = kwargs.get("color", "white")
                  font = pygame.font.Font(None, size)
                  rendered = font.render(str(text), True, pygame.Color(color))
                  center = kwargs.get("center")
                  if center is not None:
                      rect = rendered.get_rect(center=(int(center[0]), int(center[1])))
                  else:
                      rect = rendered.get_rect(topleft=kwargs.get("topleft", (0, 0)))
                  self.surface.blit(rendered, rect)

          class _ScreenProxy:
              def __init__(self):
                  self.surface = pygame.display.set_mode((WIDTH, HEIGHT))
                  self.draw = _DrawProxy(self.surface)

              def blit(self, image, pos):
                  surface = _load_image(image) if isinstance(image, str) else image
                  self.surface.blit(surface, pos)

              def fill(self, color):
                  self.surface.fill(color)

          screen = _ScreenProxy()

          class Actor:
              def __init__(self, image):
                  self._image_name = str(image)
                  self._surface = _load_image(self._image_name)
                  self._x = 0.0
                  self._y = 0.0
                  self.angle = 0

              @property
              def image(self):
                  return self._image_name

              @image.setter
              def image(self, value):
                  self._image_name = str(value)
                  self._surface = _load_image(self._image_name)

              @property
              def x(self):
                  return self._x

              @x.setter
              def x(self, value):
                  self._x = float(value)

              @property
              def y(self):
                  return self._y

              @y.setter
              def y(self, value):
                  self._y = float(value)

              @property
              def pos(self):
                  return self._x, self._y

              @pos.setter
              def pos(self, value):
                  self._x, self._y = float(value[0]), float(value[1])

              @property
              def width(self):
                  return self._surface.get_width()

              @property
              def height(self):
                  return self._surface.get_height()

              @property
              def rect(self):
                  return self._surface.get_rect(center=(round(self._x), round(self._y)))

              def draw(self):
                  surface = self._surface
                  if self.angle:
                      surface = pygame.transform.rotate(surface, self.angle)
                  rect = surface.get_rect(center=(round(self._x), round(self._y)))
                  screen.surface.blit(surface, rect)

              def collidepoint(self, pos):
                  return self.rect.collidepoint(pos)

              def colliderect(self, other):
                  return self.rect.colliderect(other.rect)

              def collidelist(self, actors):
                  return self.rect.collidelist([actor.rect for actor in actors])

          class _Clock:
              def __init__(self):
                  self.events = []

              def schedule(self, fn, delay):
                  self.events.append([time.monotonic() + float(delay), 0.0, fn])

              def schedule_unique(self, fn, delay):
                  self.events = [e for e in self.events if e[2] is not fn]
                  self.schedule(fn, delay)

              def schedule_interval(self, fn, interval):
                  self.events.append([time.monotonic() + float(interval), float(interval), fn])

              def tick(self):
                  now = time.monotonic()
                  due = []
                  remaining = []
                  for event in self.events:
                      if now >= event[0]:
                          due.append(event)
                      else:
                          remaining.append(event)
                  self.events = remaining
                  for when, interval, fn in due:
                      fn()
                      if interval > 0 and _running:
                          self.events.append([now + interval, interval, fn])

          clock = _Clock()

          class _Keyboard:
              @property
              def left(self):
                  return bool(pygame.key.get_pressed()[pygame.K_LEFT])

              @property
              def right(self):
                  return bool(pygame.key.get_pressed()[pygame.K_RIGHT])

              @property
              def up(self):
                  return bool(pygame.key.get_pressed()[pygame.K_UP])

              @property
              def down(self):
                  return bool(pygame.key.get_pressed()[pygame.K_DOWN])

          keyboard = _Keyboard()

          class _Sound:
              def __init__(self, name):
                  self.name = name

              def play(self):
                  try:
                      if self.name not in _sound_cache:
                          _sound_cache[self.name] = pygame.mixer.Sound(
                              _asset_path("sounds", self.name)
                          )
                      _sound_cache[self.name].play()
                  except Exception:
                      pass

          class _Sounds:
              laser_shoot = _Sound("laser_shoot.ogg")

          sounds = _Sounds()

          class _Music:
              def __init__(self):
                  self.current = None

              def play(self, name):
                  try:
                      filename = _asset_path("music", str(name) + ".ogg")
                      pygame.mixer.music.load(filename)
                      pygame.mixer.music.play(-1)
                      self.current = filename
                  except Exception:
                      pass

              def stop(self):
                  try:
                      pygame.mixer.music.stop()
                  except Exception:
                      pass

              def pause(self):
                  try:
                      pygame.mixer.music.pause()
                  except Exception:
                      pass

              def unpause(self):
                  try:
                      pygame.mixer.music.unpause()
                  except Exception:
                      pass

          music = _Music()

          def quit():
              global _running
              _running = False

          def _handle_events():
              global _running
              for event in pygame.event.get():
                  if event.type == pygame.QUIT:
                      _running = False
                  elif event.type == pygame.MOUSEBUTTONDOWN and event.button == 1:
                      callback = globals().get("on_mouse_down")
                      if callback:
                          callback(event.pos)
                  elif event.type == pygame.MOUSEBUTTONUP and event.button == 1:
                      callback = globals().get("on_mouse_up")
                      if callback:
                          callback(event.pos)
          '''
          # Remove the YAML/heredoc indentation without guessing a fixed
          # number of spaces. The previous 10-space slicing caused an
          # IndentationError in the generated main.py.
          compat = textwrap.dedent(compat).strip("\n") + "\n"

          if marker not in s:
              raise SystemExit("Could not find TITLE marker")
          s = s.replace(marker, marker + compat, 1)

          # Replace the Pygame Zero entrypoint with a real async pygame loop.
          s += r'''
          
          async def _game_main():
              global _running
              while _running:
                  _handle_events()
                  clock.tick()
                  update()
                  draw()
                  pygame.display.flip()
                  await asyncio.sleep(0)
          
          asyncio.run(_game_main())
          '''

          Path("Aliya_web.py").write_text(s, encoding="utf-8")
          Path("main.py").write_text(s, encoding="utf-8")
          PY
          python -m py_compile main.py
      - name: Validate browser source
        run: |
          if grep -nE 'open\([^\n]*["'\''"]w["'\''"]\)' main.py; then
            echo "ERROR: browser-incompatible file write remains"
            exit 1
          fi
          grep -n "async def _game_main" main.py

      - name: Build web game
        run: |
          rm -rf build
          python -m pygbag --build --ume_block 0 main.py
          # Pygbag can wait for a user action; enable automatic startup for GitHub Pages.
          python - <<'PY'
          from pathlib import Path
          p = Path("build/web/index.html")
          s = p.read_text(encoding="utf-8")
          s = s.replace("autorun : 0", "autorun : 1", 1)
          p.write_text(s, encoding="utf-8")
          PY
          test -f build/web/index.html
          test -f build/web/aliya.apk
          test -f build/web/aliya.tar.gz
          tar -tzf build/web/aliya.tar.gz | grep -q "assets/main.py"

      - name: Browser smoke test
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python -m http.server 8000 --directory build/web >/tmp/aliya-http.log 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID || true" EXIT
          cat > /tmp/test_aliya.py <<'PY'
          import asyncio
          from playwright.async_api import async_playwright

          async def main():
              errors = []
              console = []
              async with async_playwright() as p:
                  browser = await p.chromium.launch()
                  page = await browser.new_page(viewport={"width": 1200, "height": 800})
                  page.on("pageerror", lambda e: errors.append("PAGEERROR: " + str(e)))
                  page.on("console", lambda m: console.append(f"{m.type}: {m.text}"))
                  await page.goto("http://127.0.0.1:8000/", wait_until="load", timeout=30000)
                  await page.wait_for_timeout(90000)
                  await page.screenshot(path="/tmp/aliya.png", full_page=True)
                  canvas = await page.locator("canvas").count()
                  body = await page.locator("body").inner_text()
                  print("CANVAS_COUNT=", canvas)
                  print("BODY_TEXT=", body[:1000])
                  print("PAGE_ERRORS=", errors[-20:])
                  print("CONSOLE=", console[-50:])
                  if errors:
                      raise RuntimeError("\n".join(errors[-20:]))
                  if canvas == 0:
                      raise RuntimeError("No canvas was created by the game.")
                  await browser.close()

          asyncio.run(main())
          PY
          python /tmp/test_aliya.py

      - name: Collect browser diagnostics
        if: always()
        run: |
          echo "=== HTTP SERVER LOG ==="
          cat /tmp/aliya-http.log || true
          echo "=== SCREENSHOT INFO ==="
          python - <<'PY'
          from pathlib import Path
          try:
              from PIL import Image
              p = Path("/tmp/aliya.png")
              if p.exists():
                  im = Image.open(p).convert("RGB")
                  print("SCREENSHOT_SIZE=", im.size)
                  print("CENTER_PIXEL=", im.getpixel((im.width//2, im.height//2)))
                  print("TOPLEFT_PIXEL=", im.getpixel((0, 0)))
                  print("UNIQUE_SAMPLE_PIXELS=", len(set(im.resize((100,100)).getdata())))
          except Exception as e:
              print("SCREENSHOT_ANALYSIS_ERROR=", repr(e))
          PY
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics
          path: |
            /tmp/aliya.png
            /tmp/aliya_canvas.png
            /tmp/aliya-http.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
