name: Build and deploy Aliya to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pgzero pygbag

      - name: Prepare web-compatible source
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          source = Path("Aliya.py").read_text(encoding="utf-8")

          # Remove desktop-only imports. The game itself does not need them
          # for normal gameplay in the browser.
          source = source.replace("import pyperclip\n", "pyperclip = None\n", 1)
          source = source.replace("import tkinter as tk\n", "", 1)
          source = source.replace("from tkinter import messagebox\n", "", 1)
          source = source.replace("from ctypes import windll\n", "", 1)

          # Remove Windows-only window positioning.
          source = source.replace(
              "hwnd = pygame.display.get_wm_info()['window']\n"
              "windll.user32.MoveWindow(hwnd, 175, 100, WIDTH, HEIGHT, False)\n",
              "",
              1,
          )

          # The original hacking screen creates a Tk window, which cannot
          # exist in a browser. Keep the game state valid and return to menu.
          source = re.sub(
              r"def hack_game\(\):\n.*?(?=\n\ndef draw\(\):)",
              'def hack_game():\n    global game_status\n    game_status = "starting_menu"\n',
              source,
              count=1,
              flags=re.S,
          )

          # Clipboard operations are optional in the browser.
          source = source.replace(
              '        pyperclip.copy("+989044089850")',
              '        if pyperclip is not None:\n            pyperclip.copy("+989044089850")',
          )
          source = source.replace(
              '        pyperclip.copy("ali.talabi.25@gmail.com")',
              '        if pyperclip is not None:\n            pyperclip.copy("ali.talabi.25@gmail.com")',
          )

          Path("Aliya_web.py").write_text(source, encoding="utf-8")
          PY

          python -m py_compile Aliya_web.py

          # Fail early if desktop-only dependencies or the Windows API call
          # accidentally survived the transformation.
          if grep -nE '(^|[[:space:]])(import tkinter|from tkinter|from ctypes import windll|windll\.user32\.MoveWindow)' Aliya_web.py; then
            echo "Desktop-only code survived web preparation."
            exit 1
          fi

      - name: Build Pygame Zero game for the web
        run: |
          rm -rf build/web
          python -m pygbag --build Aliya_web.py

      - name: Prepare GitHub Pages artifact
        run: |
          test -f build/web/index.html
          test -f build/web/aliya.apk
          test -f build/web/aliya.tar.gz
          touch build/web/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
